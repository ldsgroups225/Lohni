name: CI/CD Pipeline
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [26.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
    
    # Backend validation
    - name: Install backend dependencies
      run: npm ci
      working-directory: ./
    
    - name: Build backend
      run: npm run build
      working-directory: ./
    
    # Frontend validation
    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./frontend
    
    - name: Build frontend
      run: npm run build
      working-directory: ./frontend
    
    - name: Run tests
      run: npm test

    - name: Type-check frontend tests
      run: npx tsc -p frontend/tsconfig.json

    - name: Lint backend
      run: npm run lint

    - name: Lint frontend
      run: npm run lint --prefix frontend

    # Security and dependency checks
    - name: Run npm audit (backend)
      run: npm audit --audit-level=moderate
      working-directory: ./
      continue-on-error: true
    
    - name: Run npm audit (frontend)
      run: npm audit --audit-level=moderate
      working-directory: ./frontend
      continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build backend Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: pagelm-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build frontend Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile
        push: false
        tags: pagelm-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26.x'
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
    
    - name: Install dependencies (backend)
      run: npm ci
      working-directory: ./
    
    - name: Check for known vulnerabilities (backend)
      run: npm audit --audit-level=high
      working-directory: ./
      continue-on-error: false
    
    - name: Install dependencies (frontend)
      run: npm ci
      working-directory: ./frontend
    
    - name: Check for known vulnerabilities (frontend)
      run: npm audit --audit-level=high
      working-directory: ./frontend
      continue-on-error: false

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate, docker-build, dependency-check]
    if: always()
    
    steps:
    - name: Check results
      run: |
        if [[ "${{ needs.validate.result }}" == "failure" || \
              "${{ needs.docker-build.result }}" == "failure" || \
              "${{ needs.dependency-check.result }}" == "failure" ]]; then
          echo "❌ Some validation checks failed"
          exit 1
        else
          echo "✅ All validation checks passed"
        fi
